<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GOLD V4.0 | MASTER INTEL</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#05070a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/jpeg" href="logo.jpg">

    <style>
        :root {
            --accent-gold: #d4af37;
            --accent-green: #00ff80;
            --accent-red: #ff4d4d;
            --glass-bg: rgba(15, 20, 30, 0.9);
            --glass-border: rgba(212, 175, 55, 0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: fixed radial-gradient(circle at top right, #1a1a1a, #05070a); color: #e0e0e0; min-height: 100vh; padding: 15px; }
        .container { max-width: 1200px; margin: 0 auto; }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
        }

        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .logo-area { display: flex; align-items: center; gap: 15px; }
        .logo-img { width: 55px; height: 55px; border-radius: 50%; border: 2px solid var(--accent-gold); box-shadow: 0 0 15px rgba(212, 175, 55, 0.4); }
        .logo-text { font-weight: 800; font-size: 1.6rem; background: linear-gradient(to right, #d4af37, #fff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .search-container { display: flex; gap: 10px; margin-bottom: 10px; }
        .search-container input {
            flex: 1; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border);
            padding: 15px; border-radius: 12px; color: white; font-size: 1rem;
        }

        .btn-backup { background: rgba(255,255,255,0.1); border: 1px solid var(--glass-border); color: var(--accent-gold); padding: 0 15px; border-radius: 12px; cursor: pointer; font-size: 0.8rem; font-weight: 600; }

        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 20px; }
        .stat-card { text-align: center; padding: 15px; border-radius: 15px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); }
        .stat-label { font-size: 0.65rem; text-transform: uppercase; opacity: 0.6; letter-spacing: 1px; }
        .stat-value { display: block; font-size: 1.1rem; font-weight: 800; color: var(--accent-gold); }

        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; }
        .field { display: flex; flex-direction: column; gap: 5px; }
        label { font-size: 0.7rem; font-weight: 600; color: var(--accent-gold); }
        input { background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); padding: 12px; border-radius: 8px; color: white; transition: 0.3s; font-size: 16px !important; }
        input:focus { border-color: var(--accent-gold); background: rgba(0,0,0,0.6); outline: none; }

        .smart-info {
            background: rgba(212, 175, 55, 0.1); border-radius: 8px; padding: 12px; margin-top: 15px;
            border-left: 4px solid var(--accent-gold); font-size: 0.85rem; display: flex; justify-content: space-between; align-items: center;
        }

        .btn-gold {
            background: linear-gradient(45deg, #d4af37, #f1d592); color: #000; border: none;
            padding: 18px; border-radius: 12px; font-weight: 800; width: 100%; margin-top: 20px;
            cursor: pointer; text-transform: uppercase;
        }

        .table-wrapper { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        table { width: 100%; border-collapse: collapse; min-width: 900px; }
        th { text-align: left; padding: 15px; color: var(--accent-gold); font-size: 0.7rem; border-bottom: 1px solid var(--glass-border); }
        td { padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.9rem; }

        .last-edited { border-left: 3px solid var(--accent-gold) !important; background: rgba(212, 175, 55, 0.05); }

        .progress-container { width: 100%; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; margin-top: 8px; overflow: hidden; }
        .progress-bar { height: 100%; background: var(--accent-green); transition: width 0.5s ease; }

        .status-badge { padding: 4px 8px; border-radius: 4px; font-size: 0.65rem; font-weight: 800; }
        .bg-red { background: rgba(255, 77, 77, 0.2); color: var(--accent-red); animation: pulse 1.5s infinite; }
        .bg-green { background: rgba(0, 255, 128, 0.2); color: var(--accent-green); }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }

        .action-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); cursor: pointer; font-size: 1.1rem; transition: 0.2s; padding: 12px; border-radius: 8px; margin-right: 5px; color: white; }
        .action-btn:hover { background: var(--accent-gold); color: black; }

        @media (max-width: 800px) { 
            .stats-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
            .logo-text { font-size: 1.3rem; }
            .btn-gold { padding: 22px; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="logo-area">
            <img src="logo.jpg" class="logo-img" onerror="this.style.display='none'">
            <div class="logo-text">GOLD V4.0</div>
        </div>
        <div id="date-now" style="font-size: 0.8rem; opacity: 0.7;"></div>
    </header>

    <div class="search-container">
        <input type="text" id="searchInput" placeholder="🔍 Buscar cliente, serviço ou status..." onkeyup="renderTable()">
        <button class="btn-backup" onclick="exportData()">📦 BACKUP</button>
    </div>

    <div class="stats-grid">
        <div class="glass-panel stat-card"><span class="stat-label">Vendas</span><span class="stat-value" id="stat-total">R$ 0,00</span></div>
        <div class="glass-panel stat-card"><span class="stat-label">Recebido</span><span class="stat-value" id="stat-received" style="color:var(--accent-green)">R$ 0,00</span></div>
        <div class="glass-panel stat-card"><span class="stat-label">Pendente</span><span class="stat-value" id="stat-pending" style="color:var(--accent-red)">R$ 0,00</span></div>
        <div class="glass-panel stat-card"><span class="stat-label">Ticket Médio</span><span class="stat-value" id="stat-avg">R$ 0,00</span></div>
    </div>

    <div class="glass-panel" id="formPanel">
        <form id="mainForm">
            <input type="hidden" id="editIdx" value="-1">
            <div class="form-grid">
                <div class="field"><label>Nome do Cliente</label><input type="text" id="cName" required></div>
                <div class="field"><label>WhatsApp</label><input type="tel" id="cPhone" placeholder="DDD+Número"></div>
                <div class="field"><label>Serviço</label><input type="text" id="cServ" required></div>
                <div class="field"><label>Data Limite</label><input type="date" id="cDate" required></div>
                <div class="field"><label>Valor Total R$</label><input type="number" id="vTotal" step="0.01" required oninput="smartAutoFill()"></div>
            </div>

            <div class="form-grid" style="margin-top: 20px;">
                <div class="field"><label>Entrada 1</label><input type="number" id="vE1" step="0.01" value="0" oninput="smartAutoFill()"></div>
                <div class="field"><label>Entrada 2</label><input type="number" id="vE2" step="0.01" value="0" oninput="smartAutoFill()"></div>
                <div class="field"><label>Quitação Final</label><input type="number" id="vQuit" step="0.01" value="0" onclick="autoCompleteQuit()"></div>
            </div>

            <div class="smart-info">
                <span id="smartSuggestion">💡 Pronto para calcular...</span>
                <span id="smartPercent" style="font-weight: 800; color: var(--accent-gold);">0%</span>
            </div>

            <button type="submit" class="btn-gold" id="saveBtn">Salvar Registro Inteligente</button>
        </form>
    </div>

    <div class="glass-panel table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>STATUS / CLIENTE</th>
                    <th>SERVIÇO</th>
                    <th>VALORES</th>
                    <th>PROGRESSO</th>
                    <th>AÇÕES</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script>
    let db = JSON.parse(localStorage.getItem('GOLD_V4_MASTER')) || [];
    let lastModifiedIdx = -1;
    const META_TICKET = 500.00;

    function cleanVal(val) { 
        const n = parseFloat(val); 
        return isNaN(n) ? 0 : n; 
    }

    function smartAutoFill() {
        const total = cleanVal(document.getElementById('vTotal').value);
        const e1 = cleanVal(document.getElementById('vE1').value);
        const e2 = cleanVal(document.getElementById('vE2').value);
        const quit = cleanVal(document.getElementById('vQuit').value);
        const pago = e1 + e2 + quit;
        
        const percent = total > 0 ? (pago / total) * 100 : 0;
        document.getElementById('smartPercent').innerText = Math.min(percent, 100).toFixed(0) + "%";
        
        // Cálculo de previsão seguro (sem travar)
        let somaVendas = 0;
        db.forEach(item => somaVendas += cleanVal(item.total));
        
        let qtd = db.length;
        if(document.getElementById('editIdx').value === "-1") {
            somaVendas += total;
            qtd += 1;
        }

        const previsao = qtd > 0 ? (somaVendas / qtd) : 0;
        
        if (total > 0) {
            let cor = previsao < META_TICKET ? 'var(--accent-red)' : 'var(--accent-green)';
            document.getElementById('smartSuggestion').innerHTML = `💡 Falta: <b>R$ ${(total - (e1+e2+quit)).toFixed(2)}</b>. <small style="color:${cor}">Prev: R$ ${previsao.toFixed(2)}</small>`;
        }
    }

    function autoCompleteQuit() {
        const total = cleanVal(document.getElementById('vTotal').value);
        const e1 = cleanVal(document.getElementById('vE1').value);
        const e2 = cleanVal(document.getElementById('vE2').value);
        if (total > 0) {
            document.getElementById('vQuit').value = (total - (e1 + e2)).toFixed(2);
            smartAutoFill();
        }
    }

    function renderTable() {
        const tbody = document.getElementById('tableBody');
        const search = document.getElementById('searchInput').value.toLowerCase();
        tbody.innerHTML = '';
        let tVendas = 0, tRec = 0, tPen = 0;

        db.forEach((item, index) => {
            const vTotal = cleanVal(item.total);
            const vPago = cleanVal(item.e1) + cleanVal(item.e2) + cleanVal(item.quit);
            const vSaldo = vTotal - vPago;
            const percent = vTotal > 0 ? (vPago / vTotal) * 100 : 0;
            const isAtrasado = vSaldo > 0 && item.date && new Date(item.date) < new Date();
            const statusLabel = vSaldo <= 0 ? "QUITADO" : (isAtrasado ? "ATRASADO" : "EM DIA");

            if (!item.name.toLowerCase().includes(search) && !item.serv.toLowerCase().includes(search)) return;

            tVendas += vTotal; tRec += vPago; tPen += vSaldo;

            tbody.innerHTML += `
                <tr class="${index === lastModifiedIdx ? 'last-edited' : ''}">
                    <td>
                        <span class="status-badge ${vSaldo <= 0 ? 'bg-green' : (isAtrasado ? 'bg-red' : '')}">${statusLabel}</span><br>
                        <strong style="cursor:pointer; color:var(--accent-gold)" onclick="editItem(${index})">${item.name.toUpperCase()}</strong>
                    </td>
                    <td>${item.serv}<br><small style="opacity:0.5">${item.date || ''}</small></td>
                    <td><b>R$ ${vTotal.toFixed(2)}</b><br><small>Falta: R$ ${vSaldo.toFixed(2)}</small></td>
                    <td>
                        <div class="progress-container"><div class="progress-bar" style="width: ${Math.min(percent, 100)}%"></div></div>
                    </td>
                    <td>
                        <button class="action-btn" onclick="quickPay(${index})">✅</button>
                        <button class="action-btn" onclick="deleteItem(${index})">🗑️</button>
                    </td>
                </tr>
            `;
        });

        document.getElementById('stat-total').innerText = `R$ ${tVendas.toFixed(2)}`;
        document.getElementById('stat-received').innerText = `R$ ${tRec.toFixed(2)}`;
        document.getElementById('stat-pending').innerText = `R$ ${tPen.toFixed(2)}`;
        
        const tm = db.length > 0 ? (tVendas / db.length) : 0;
        const avgElem = document.getElementById('stat-avg');
        avgElem.innerText = `R$ ${tm.toFixed(2)}`;
        avgElem.style.color = tm >= META_TICKET ? "var(--accent-green)" : "var(--accent-red)";
    }

    function quickPay(index) {
        if(confirm("Marcar como pago?")) {
            const item = db[index];
            item.quit = (cleanVal(item.total) - (cleanVal(item.e1) + cleanVal(item.e2))).toFixed(2);
            saveData();
        }
    }

    document.getElementById('mainForm').onsubmit = function(e) {
        e.preventDefault();
        const idx = parseInt(document.getElementById('editIdx').value);
        const data = {
            name: document.getElementById('cName').value,
            phone: document.getElementById('cPhone').value,
            serv: document.getElementById('cServ').value,
            date: document.getElementById('cDate').value,
            total: document.getElementById('vTotal').value,
            e1: document.getElementById('vE1').value,
            e2: document.getElementById('vE2').value,
            quit: document.getElementById('vQuit').value
        };

        if(idx === -1) { 
            db.push(data); 
            lastModifiedIdx = db.length - 1; 
        } else { 
            db[idx] = data; 
            lastModifiedIdx = idx; 
        }

        saveData();
        this.reset();
        document.getElementById('editIdx').value = "-1";
        document.getElementById('saveBtn').innerText = "Salvar Registro Inteligente";
        document.getElementById('smartPercent').innerText = "0%";
    };

    function editItem(index) {
        const item = db[index];
        document.getElementById('cName').value = item.name;
        document.getElementById('cPhone').value = item.phone;
        document.getElementById('cServ').value = item.serv;
        document.getElementById('cDate').value = item.date;
        document.getElementById('vTotal').value = item.total;
        document.getElementById('vE1').value = item.e1;
        document.getElementById('vE2').value = item.e2;
        document.getElementById('vQuit').value = item.quit;
        document.getElementById('editIdx').value = index;
        document.getElementById('saveBtn').innerText = "Atualizar Master Gold";
        window.scrollTo({top: 0, behavior: 'smooth'});
        smartAutoFill();
    }

    function saveData() { 
        localStorage.setItem('GOLD_V4_MASTER', JSON.stringify(db)); 
        renderTable(); 
    }

    function deleteItem(index) { if(confirm("Apagar?")) { db.splice(index, 1); saveData(); } }

    function exportData() {
        if(db.length === 0) return alert("Vazio!");
        let t = "BACKUP GOLD:\n";
        db.forEach(i => t += `- ${i.name}: R$ ${i.total}\n`);
        navigator.clipboard.writeText(t);
        alert("Backup copiado!");
    }
    
    document.getElementById('date-now').innerText = "SISTEMA ATIVO: " + new Date().toLocaleDateString('pt-BR');
    renderTable();
</script>
</body>
</html>
