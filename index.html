<!DOCTYPE html>
<html lang="pt-br">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AMP GOLD V7 PRO</title>

<link rel="manifest" href="manifest.json">
<link rel="icon" href="logo.png">

<link rel="stylesheet" href="style.css">

</head>

<body>

<div id="login">

<img src="logo.png" class="logo">

<h2>Login AMP</h2>

<input type="email" id="email" placeholder="Email">
<input type="password" id="senha" placeholder="Senha">

<button onclick="login()">Entrar</button>

</div>


<div id="app">

<header>

<img src="logo.png" class="logo-small">

<h1>Sistema AMP Clientes</h1>

</header>


<section class="cadastro">

<h3>Novo Cliente</h3>

<input id="nome" placeholder="Nome cliente">
<input id="telefone" placeholder="WhatsApp">
<input id="servico" placeholder="Serviço">

<input id="valorTotal" placeholder="Valor total">

<button onclick="salvar()">Salvar Cliente</button>

</section>


<section>

<h3>Clientes</h3>

<table>

<thead>

<tr>
<th>Cliente</th>
<th>Serviço</th>
<th>Valor</th>
<th>Status</th>
<th>Ação</th>
</tr>

</thead>

<tbody id="lista"></tbody>

</table>

</section>

</div>

<script src="script.js"></script>

</body>
</html>
