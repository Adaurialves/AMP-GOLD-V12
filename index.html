<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AMP GOLD V12 IA</title>

<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf"></script>

</head>

<body>

<header>

<img src="logo.png" class="logo">

<h1>AMP GOLD V12 IA</h1>

</header>

<nav>

<button onclick="abrir('clientes')">Clientes</button>
<button onclick="abrir('dashboard')">Dashboard</button>
<button onclick="abrir('ia')">IA Orçamento</button>

</nav>

<section id="clientes">

<h2>Novo Cliente</h2>

<input id="nome" placeholder="Cliente">
<input id="telefone" placeholder="Telefone">
<input id="servico" placeholder="Serviço">

<input id="valor" placeholder="Valor total">
<input id="entrada" placeholder="Entrada">
<input id="quitacao" placeholder="Quitação">

<button onclick="salvarCliente()">Salvar</button>

<table>

<thead>
<tr>
<th>Cliente</th>
<th>Serviço</th>
<th>Valores</th>
<th>Status</th>
<th>Ações</th>
</tr>
</thead>

<tbody id="listaClientes"></tbody>

</table>

</section>

<section id="dashboard">

<h2>Dashboard Financeiro</h2>

<canvas id="grafico"></canvas>

</section>

<section id="ia">

<h2>IA Gerar Orçamento</h2>

<input id="tipoMovel" placeholder="Tipo de móvel (ex: cozinha)">
<input id="tamanho" placeholder="Tamanho (ex: 3 metros)">
<input id="complexidade" placeholder="Complexidade (baixa / média / alta)">

<button onclick="gerarOrcamentoIA()">Gerar Orçamento</button>

<div id="orcamentoIA"></div>

</section>

<script src="firebase.js"></script>
<script src="ia.js"></script>
<script src="app.js"></script>

</body>
</html>
